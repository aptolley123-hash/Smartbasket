<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartBasket - Shop Smarter</title>

<style>

:root{

  --dark:#174b2a;

  --green:#2e8b57;

  --light:#f4f8f5;

  --accent:#e4f1e8;

  --text:#1f2933;

  --muted:#667085;

  --white:#ffffff;

  --danger:#c0392b;

}

*{

  box-sizing:border-box;

}

body{

  margin:0;

  font-family:Arial, Helvetica, sans-serif;

  background:var(--light);

  color:var(--text);

}

header{

  background:linear-gradient(135deg,#174b2a,#2e8b57);

  color:white;

  padding:18px;

  position:sticky;

  top:0;

  z-index:10;

  box-shadow:0 2px 10px rgba(0,0,0,.15);

}

.header-inner{

  max-width:1180px;

  margin:auto;

  display:flex;

  justify-content:space-between;

  align-items:center;

}

.logo{

  display:flex;

  align-items:center;

  gap:10px;

  font-size:24px;

  font-weight:bold;

}

.logo-icon{

  font-size:30px;

}

.cart-button{

  background:white;

  color:var(--dark);

  border:none;

  padding:10px 16px;

  border-radius:25px;

  font-weight:bold;

  cursor:pointer;

  font-size:16px;

}

.hero{

  background:linear-gradient(135deg,#e4f1e8,#ffffff);

  padding:45px 20px;

  text-align:center;

}

.hero h1{

  margin:0;

  font-size:clamp(30px,5vw,50px);

  color:var(--dark);

}

.hero p{

  color:var(--muted);

  font-size:18px;

  max-width:650px;

  margin:15px auto;

}

.container{

  max-width:1180px;

  margin:auto;

  padding:25px 20px 60px;

}

.controls{

  display:flex;

  gap:12px;

  flex-wrap:wrap;

  margin-bottom:25px;

}

.search{

  flex:1;

  min-width:220px;

  padding:14px;

  border:1px solid #ddd;

  border-radius:10px;

  font-size:16px;

}

select{

  padding:14px;

  border:1px solid #ddd;

  border-radius:10px;

  background:white;

  font-size:16px;

}

.section-title{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:18px;

}

.product-grid{

  display:grid;

  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

  gap:18px;

}

.product{

  background:white;

  border-radius:15px;

  padding:18px;

  box-shadow:0 3px 12px rgba(0,0,0,.08);

  transition:.2s;

}

.product:hover{

  transform:translateY(-3px);

}

.product-image{

  height:120px;

  display:flex;

  justify-content:center;

  align-items:center;

  font-size:70px;

  background:#f5f7f6;

  border-radius:12px;

  margin-bottom:12px;

}

.product h3{

  margin:8px 0;

}

.price{

  color:var(--green);

  font-size:20px;

  font-weight:bold;

}

.category{

  color:var(--muted);

  font-size:13px;

}

.add-button{

  width:100%;

  margin-top:12px;

  padding:12px;

  border:none;

  background:var(--dark);

  color:white;

  border-radius:8px;

  font-weight:bold;

  cursor:pointer;

}

.add-button:hover{

  background:var(--green);

}

/* CART */

.cart-panel{

  display:none;

  position:fixed;

  top:0;

  right:0;

  width:min(420px,100%);

  height:100vh;

  background:white;

  z-index:100;

  box-shadow:-5px 0 20px rgba(0,0,0,.2);

  padding:20px;

  overflow-y:auto;

}

.cart-panel.open{

  display:block;

}

.cart-header{

  display:flex;

  justify-content:space-between;

  align-items:center;

  border-bottom:1px solid #eee;

  padding-bottom:15px;

}

.close{

  border:none;

  background:#eee;

  width:38px;

  height:38px;

  border-radius:50%;

  font-size:20px;

  cursor:pointer;

}

.cart-item{

  display:flex;

  justify-content:space-between;

  gap:10px;

  padding:15px 0;

  border-bottom:1px solid #eee;

}

.cart-item-info{

  flex:1;

}

.quantity-controls{

  display:flex;

  align-items:center;

  gap:10px;

  margin-top:8px;

}

.qty-btn{

  width:30px;

  height:30px;

  border:none;

  border-radius:6px;

  background:var(--accent);

  font-size:18px;

  cursor:pointer;

}

.remove{

  color:var(--danger);

  border:none;

  background:none;

  cursor:pointer;

  margin-top:5px;

}

.cart-total{

  margin-top:20px;

  padding-top:20px;

  border-top:2px solid #eee;

}

.total-row{

  display:flex;

  justify-content:space-between;

  font-size:22px;

  font-weight:bold;

}

.checkout{

  width:100%;

  margin-top:18px;

  padding:15px;

  border:none;

  border-radius:10px;

  background:var(--green);

  color:white;

  font-size:17px;

  font-weight:bold;

  cursor:pointer;

}

.empty{

  text-align:center;

  color:var(--muted);

  padding:50px 10px;

}

.badge{

  display:inline-block;

  background:#e53935;

  color:white;

  min-width:22px;

  height:22px;

  border-radius:20px;

  text-align:center;

  line-height:22px;

  font-size:13px;

  margin-left:5px;

}

footer{

  text-align:center;

  padding:30px;

  color:var(--muted);

}

@media(max-width:600px){

  .header-inner{

    gap:10px;

  }

  .logo{

    font-size:20px;

  }

}

</style>

</head>

<body>

<header>

  <div class="header-inner">

    <div class="logo">

      <span class="logo-icon">🛒</span>

      SmartBasket

    </div>

    <button class="cart-button" onclick="toggleCart()">

      Basket <span class="badge" id="cartCount">0</span>

    </button>

  </div>

</header>

<section class="hero">

  <h1>The smarter way to shop.</h1>

  <p>

    Build your basket, keep track of your spending and shop smarter with SmartBasket.

  </p>

</section>

<main class="container">

<div class="controls">

<input

class="search"

id="searchInput"

placeholder="Search products..."

oninput="filterProducts()"

>

<select id="categoryFilter" onchange="filterProducts()">

<option value="all">All categories</option>

<option value="Fruit">Fruit</option>

<option value="Vegetables">Vegetables</option>

<option value="Bakery">Bakery</option>

<option value="Dairy">Dairy</option>

<option value="Meat">Meat</option>

</select>

</div>

<div class="section-title">

<h2>Popular products</h2>

<span id="productCount"></span>

</div>

<div class="product-grid" id="productGrid"></div>

</main>

<!-- SHOPPING CART -->

<div class="cart-panel" id="cartPanel">

<div class="cart-header">

<h2>Your Basket</h2>

<button class="close" onclick="toggleCart()">×</button>

</div>

<div id="cartItems"></div>

<div class="cart-total">

<div class="total-row">

<span>Total</span>

<span id="cartTotal">£0.00</span>

</div>

<button class="checkout" onclick="checkout()">

Checkout

</button>

</div>

</div>

<footer>

© 2026 SmartBasket · Shop smarter.

</footer>

<script>

const products = [

{

id:1,

name:"Bananas",

price:1.20,

category:"Fruit",

image:"🍌"

},

{

id:2,

name:"Red Apples",

price:2.00,

category:"Fruit",

image:"🍎"

},

{

id:3,

name:"Strawberries",

price:2.50,

category:"Fruit",

image:"🍓"

},

{

id:4,

name:"Carrots",

price:0.90,

category:"Vegetables",

image:"🥕"

},

{

id:5,

name:"Broccoli",

price:1.10,

category:"Vegetables",

image:"🥦"

},

{

id:6,

name:"Sliced Bread",

price:1.50,

category:"Bakery",

image:"🍞"

},

{

id:7,

name:"Milk",

price:1.45,

category:"Dairy",

image:"🥛"

},

{

id:8,

name:"Cheddar Cheese",

price:2.75,

category:"Dairy",

image:"🧀"

},

{

id:9,

name:"Chicken Breast",

price:4.50,

category:"Meat",

image:"🍗"

},

{

id:10,

name:"Eggs",

price:2.20,

category:"Dairy",

image:"🥚"

}

];

let cart = JSON.parse(localStorage.getItem("smartbasketCart")) || [];

/* DISPLAY PRODUCTS */

function displayProducts(productList){

const grid = document.getElementById("productGrid");

grid.innerHTML = "";

productList.forEach(product => {

grid.innerHTML += `

<div class="product">

<div class="product-image">

${product.image}

</div>

<div class="category">

${product.category}

</div>

<h3>${product.name}</h3>

<div class="price">

£${product.price.toFixed(2)}

</div>

<button

class="add-button"

onclick="addToCart(${product.id})"

>

Add to basket

</button>

</div>

`;

});

document.getElementById("productCount").textContent =

productList.length + " products";

}

/* ADD TO CART */

function addToCart(id){

const product = products.find(p => p.id === id);

const existingItem = cart.find(item => item.id === id);

if(existingItem){

existingItem.quantity++;

}

else{

cart.push({

...product,

quantity:1

});

}

saveCart();

updateCart();

}

/* UPDATE CART */

function updateCart(){

const cartItems = document.getElementById("cartItems");

const cartCount = document.getElementById("cartCount");

const cartTotal = document.getElementById("cartTotal");

if(cart.length === 0){

cartItems.innerHTML = `

<div class="empty">

<h3>Your basket is empty</h3>

<p>Start adding some products!</p>

</div>

`;

}

else{

cartItems.innerHTML = "";

cart.forEach(item => {

cartItems.innerHTML += `

<div class="cart-item">

<div class="cart-item-info">

<strong>${item.image} ${item.name}</strong>

<div>

£${item.price.toFixed(2)}

</div>

<div class="quantity-controls">

<button

class="qty-btn"

onclick="changeQuantity(${item.id},-1)"

>

−

</button>

<span>${item.quantity}</span>

<button

class="qty-btn"

onclick="changeQuantity(${item.id},1)"

>

+

</button>

</div>

<button

class="remove"

onclick="removeItem(${item.id})"

>

Remove

</button>

</div>

<div>

<strong>

£${(item.price * item.quantity).toFixed(2)}

</strong>

</div>

</div>

`;

});

}

const totalItems = cart.reduce(

(total,item) => total + item.quantity,

0

);

const totalPrice = cart.reduce(

(total,item) =>

total + (item.price * item.quantity),

0

);

cartCount.textContent = totalItems;

cartTotal.textContent =

"£" + totalPrice.toFixed(2);

}

/* CHANGE QUANTITY */

function changeQuantity(id, amount){

const item = cart.find(item => item.id === id);

item.quantity += amount;

if(item.quantity <= 0){

cart = cart.filter(item => item.id !== id);

}

saveCart();

updateCart();

}

/* REMOVE ITEM */

function removeItem(id){

cart = cart.filter(item => item.id !== id);

saveCart();

updateCart();

}

/* SAVE BASKET */

function saveCart(){

localStorage.setItem(

"smartbasketCart",

JSON.stringify(cart)

);

}

/* OPEN / CLOSE CART */

function toggleCart(){

document

.getElementById("cartPanel")

.classList

.toggle("open");

}

/* SEARCH + FILTER */

function filterProducts(){

const search =

document

.getElementById("searchInput")

.value

.toLowerCase();

const category =

document

.getElementById("categoryFilter")

.value;

const filtered = products.filter(product => {

const matchesSearch =

product.name

.toLowerCase()

.includes(search);

const matchesCategory =

category === "all"

||

product.category === category;

return matchesSearch && matchesCategory;

});

displayProducts(filtered);

}

/* CHECKOUT */

function checkout(){

if(cart.length === 0){

alert("Your basket is empty!");

return;

}

const total = cart.reduce(

(total,item) =>

total + (item.price * item.quantity),

0

);

alert(

"Thanks for shopping with SmartBasket!\\n\\nYour total is £"

+

total.toFixed(2)

+

"\\n\\nCheckout functionality coming soon!"

);

}

/* INITIAL LOAD */

displayProducts(products);

updateCart();

</script>

</body>

</html>
